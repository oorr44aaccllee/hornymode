<?xml version="1.0" encoding="UTF-8"?>
<!-- Icon simples com "18" dentro de um círculo. Serve como ícone base;
     o background.js coloca o selo 18+ via badge quando ligado. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="HornyMode icon">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffb3b6"/>
      <stop offset="1" stop-color="#ff5a5f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="#ffffff"/>
  <circle cx="64" cy="64" r="50" fill="url(#g)"/>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="50%" y="52%" font-size="42" text-anchor="middle" dominant-baseline="middle">18</text>
    <text x="50%" y="76%" font-size="14" text-anchor="middle" dominant-baseline="middle">+</text>
  </g>
</svg>
